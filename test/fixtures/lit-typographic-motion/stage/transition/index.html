<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Pretendard"; }
  #swatch { position: absolute; left: 100px; top: 100px; width: 400px; height: 400px; background-color: rgb(0, 0, 255); transition: background-color 1s linear; }
  #swatch.on { background-color: rgb(255, 0, 0); }
  #copy { position: absolute; left: 200px; top: 800px; margin: 0; color: #fff; font-size: 84px; }
</style>
</head>
<body>
<div id="swatch"></div>
<h1 id="copy">Lanterns drift home</h1>
<script>
  LitStage.text(document.getElementById("copy"));
  LitStage.define({
    width: 1920, height: 1080, fps: 60, duration: 4,
    render(t) {
      if (t >= 2) document.getElementById("swatch").classList.add("on");
    },
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night shift board</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #f4f4f2; background: #14161a; line-height: 1.55; }
  .wrap { max-width: 48rem; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 16px; }
  p { max-width: 65ch; margin: 0 0 12px; }
  .glass { border-radius: 16px; padding: 16px; background: rgba(255, 255, 255, 0.18); }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Night shift board</h1>
    <section class="glass" aria-label="Handover">
      <p>Ward handover notes are on the desk; the second lift is back in service since 22:40.</p>
    </section>
  </main>
</body>
</html>

<!doctype html>
<!--
  LitClaude comprehend — explainer scaffold.
  Copy this file, replace __TITLE__, __SUBTITLE__, __TOC__ and __CONTENT__.
  Everything here is inline on purpose: the artifact must open with no network.
  Do not add external <script src>, <link rel=stylesheet>, @import, or fetch().
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#fbfaf8; --fg:#1c1b19; --muted:#6b6862; --rule:#e2ded7;
    --accent:#8a5a2b; --accent-bg:#f5efe6;
    --ok:#2f6b3d; --ok-bg:#eaf3ec; --warn:#8a5a2b; --warn-bg:#faf1e4;
    --bad:#9c3328; --bad-bg:#f9ebe9; --code-bg:#f3f1ec;
    --add:#e6f2e8; --del:#fbeceb;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#171614; --fg:#e8e5df; --muted:#9d9890; --rule:#33302b;
      --accent:#d9a066; --accent-bg:#241f18;
      --ok:#7fbf8d; --ok-bg:#18241a; --warn:#d9a066; --warn-bg:#241f18;
      --bad:#e08b80; --bad-bg:#2a1a18; --code-bg:#201e1b;
      --add:#1a2a1d; --del:#2a1b1a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16.5px/1.72 -apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",
      "Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
    word-break:keep-all; overflow-wrap:break-word;
  }
  .wrap{max-width:47rem; margin:0 auto; padding:3rem 1.25rem 6rem}
  header.doc{border-bottom:2px solid var(--fg); padding-bottom:1.25rem; margin-bottom:2rem}
  header.doc h1{font-size:1.9rem; line-height:1.3; margin:0 0 .5rem; letter-spacing:-.02em}
  header.doc .sub{color:var(--muted); font-size:.95rem; margin:0}
  h2{
    font-size:1.35rem; margin:3.5rem 0 1rem; padding-top:.6rem;
    border-top:1px solid var(--rule); letter-spacing:-.01em;
  }
  h3{font-size:1.06rem; margin:2rem 0 .6rem; color:var(--fg)}
  p{margin:0 0 1rem}
  a{color:var(--accent)}
  ul,ol{margin:0 0 1rem; padding-left:1.3rem}
  li{margin:.3rem 0}
  small,.muted{color:var(--muted); font-size:.9rem}

  /* table of contents */
  nav.toc{
    background:var(--accent-bg); border:1px solid var(--rule);
    border-radius:.5rem; padding:1rem 1.25rem; margin-bottom:2.5rem;
  }
  nav.toc strong{display:block; font-size:.8rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted); margin-bottom:.5rem}
  nav.toc ol{margin:0; padding-left:1.2rem}
  nav.toc a{text-decoration:none}
  nav.toc a:hover{text-decoration:underline}

  /* code */
  pre{
    background:var(--code-bg); border:1px solid var(--rule); border-radius:.4rem;
    padding:.85rem 1rem; overflow-x:auto; white-space:pre;
    font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    margin:0 0 1rem;
  }
  pre[data-src]::before{
    content:attr(data-src); display:block; color:var(--muted);
    font-size:11.5px; letter-spacing:.04em; margin-bottom:.5rem;
    border-bottom:1px solid var(--rule); padding-bottom:.35rem;
  }
  pre .add{background:var(--add); display:block}
  pre .del{background:var(--del); display:block; opacity:.8}
  code{
    background:var(--code-bg); border-radius:.25rem; padding:.1em .35em;
    font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  pre code{background:none; padding:0; font-size:inherit}

  /* callouts */
  .note{
    border-left:3px solid var(--accent); background:var(--accent-bg);
    padding:.85rem 1rem; border-radius:0 .4rem .4rem 0; margin:0 0 1.25rem;
  }
  .note.ok{border-color:var(--ok); background:var(--ok-bg)}
  .note.warn{border-color:var(--warn); background:var(--warn-bg)}
  .note.bad{border-color:var(--bad); background:var(--bad-bg)}
  .note .label{
    display:block; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:.3rem; font-weight:600;
  }
  .note :last-child{margin-bottom:0}
  .skippable{border-left:3px dashed var(--rule); padding-left:1rem; color:var(--muted)}

  /* diagrams: pipeline / before-after / state */
  figure{margin:1.5rem 0; padding:0}
  figcaption{color:var(--muted); font-size:.87rem; margin-top:.6rem; text-align:center}
  .pipe{display:flex; align-items:center; flex-wrap:wrap; gap:.4rem; justify-content:center}
  .box{
    border:1.5px solid var(--fg); border-radius:.4rem; padding:.5rem .75rem;
    background:var(--bg); font-size:.87rem; text-align:center; min-width:5.5rem;
  }
  .box .t{font-weight:600; display:block}
  .box .d{color:var(--muted); font-size:.78rem; display:block; margin-top:.15rem}
  .box.hi{border-color:var(--accent); background:var(--accent-bg); border-width:2.5px}
  .box.ghost{border-style:dashed; color:var(--muted)}
  .arrow{color:var(--muted); font-size:1.15rem; padding:0 .1rem}
  .ba{display:grid; grid-template-columns:1fr 1fr; gap:1rem}
  .ba .side{border:1px solid var(--rule); border-radius:.5rem; padding:.9rem}
  .ba .side h4{margin:0 0 .6rem; font-size:.8rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted)}
  .ba .side.after{border-color:var(--accent)}
  @media (max-width:33rem){ .ba{grid-template-columns:1fr} }

  /* tables */
  table{border-collapse:collapse; width:100%; margin:0 0 1.25rem; font-size:.92rem}
  th,td{border:1px solid var(--rule); padding:.5rem .65rem; text-align:left; vertical-align:top}
  th{background:var(--code-bg); font-size:.82rem; letter-spacing:.03em}
  td code{font-size:12.5px}
  .scroll-x{overflow-x:auto}

  /* micro-world */
  .world{
    border:1.5px solid var(--accent); border-radius:.55rem;
    background:var(--accent-bg); padding:1.1rem; margin:0 0 1.25rem;
  }
  .world .label{
    display:block; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:.7rem; font-weight:600;
  }
  .world input[type=text],.world textarea,.world select{
    width:100%; padding:.45rem .6rem; border:1px solid var(--rule); border-radius:.3rem;
    background:var(--bg); color:var(--fg); font:13.5px ui-monospace,Menlo,monospace;
  }
  .world input[type=range]{width:100%; accent-color:var(--accent)}
  .world .out{
    background:var(--bg); border:1px solid var(--rule); border-radius:.3rem;
    padding:.6rem .75rem; margin-top:.7rem; white-space:pre-wrap;
    font:13px/1.6 ui-monospace,Menlo,monospace; min-height:2.4rem;
  }
  .world button{
    background:var(--fg); color:var(--bg); border:0; border-radius:.3rem;
    padding:.4rem .85rem; font-size:.86rem; cursor:pointer; margin-top:.55rem;
  }
  .world .row{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap}

  /* quiz */
  .quiz-q{border:1px solid var(--rule); border-radius:.5rem; padding:1.1rem; margin:0 0 1.1rem}
  .quiz-q .q{font-weight:600; margin:0 0 .8rem}
  .quiz-q .q .n{color:var(--muted); font-weight:400; margin-right:.4rem}
  .quiz-q .opt{
    display:block; width:100%; text-align:left; background:var(--bg);
    border:1px solid var(--rule); border-radius:.35rem; padding:.55rem .75rem;
    margin:0 0 .45rem; font:inherit; font-size:.94rem; color:var(--fg); cursor:pointer;
  }
  .quiz-q .opt:hover{border-color:var(--accent)}
  .quiz-q .opt.correct{border-color:var(--ok); background:var(--ok-bg)}
  .quiz-q .opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
  .quiz-q .fb{
    display:none; font-size:.9rem; padding:.6rem .75rem; border-radius:.35rem;
    margin:0 0 .5rem; background:var(--code-bg); border-left:3px solid var(--rule);
  }
  .quiz-q .fb.show{display:block}
  .quiz-q .fb.good{border-color:var(--ok)}
  .quiz-q .fb.bad{border-color:var(--bad)}
  .quiz-score{color:var(--muted); font-size:.9rem; margin-top:1rem}
</style>
</head>
<body>
<div class="wrap">
<header class="doc">
  <h1>__TITLE__</h1>
  <p class="sub">__SUBTITLE__</p>
</header>

<nav class="toc">
  <strong>목차</strong>
  <ol>__TOC__</ol>
</nav>

__CONTENT__

</div>
<script>
// Quiz engine. Each question is:
//   <div class="quiz-q" data-answer="2">
//     <p class="q"><span class="n">1.</span> ...</p>
//     <button class="opt" data-i="0">…</button> …
//     <div class="fb" data-i="0">…</div> …
//   </div>
// Every option needs a matching .fb. Feedback explains why, including for the
// correct one — a wrong click is the most teachable moment in the document.
(function () {
  var answered = 0, correct = 0;
  var qs = document.querySelectorAll('.quiz-q');
  qs.forEach(function (q) {
    var ans = parseInt(q.getAttribute('data-answer'), 10);
    q.querySelectorAll('.opt').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var was = q.getAttribute('data-done') === '1';
        var fb = q.querySelector('.fb[data-i="' + i + '"]');
        q.querySelectorAll('.fb').forEach(function (f) { f.classList.remove('show'); });
        if (fb) {
          fb.classList.add('show');
          fb.classList.toggle('good', i === ans);
          fb.classList.toggle('bad', i !== ans);
        }
        btn.classList.toggle('correct', i === ans);
        btn.classList.toggle('wrong', i !== ans);
        if (!was) {
          q.setAttribute('data-done', '1');
          answered++;
          if (i === ans) correct++;
          var s = document.getElementById('quiz-score');
          if (s) {
            s.textContent = '— ' + answered + '/' + qs.length +
              ' 응답, ' + correct + '개 정답. ' +
              '틀린 문항이 바로 다시 볼 곳입니다.';
          }
        }
      });
    });
  });
})();
</script>
</body>
</html>

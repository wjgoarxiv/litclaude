<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<style>
  :root { --bg:#070b10; --panel:#0f141b; --panel2:#131922; --line:#2a323c; --cream:#f1ecdc; --orange:#ff6a2a; --lime:#d8f552; --muted:#9aa39a; --soft:#cfc9b8; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; font-synthesis:none; }
  .abs { position:absolute; }
  #grid { position:absolute; left:-96px; top:-96px; width:2112px; height:1272px;
    background-image:linear-gradient(rgba(241,236,220,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(241,236,220,.05) 1px, transparent 1px);
    background-size:96px 96px; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse 70% 70% at 62% 50%, rgba(255,106,42,.07), rgba(7,11,16,0) 60%), radial-gradient(ellipse 100% 100% at 50% 50%, rgba(7,11,16,0) 55%, rgba(0,0,0,.55) 100%); }
  #frame { position:absolute; left:0; top:0; }
  #brand { position:absolute; left:120px; top:74px; height:30px; }
  .hl { position:absolute; left:120px; top:360px; margin:0; font:900 116px/0.96 "Archivo", sans-serif; text-transform:uppercase; color:var(--cream); white-space:nowrap; letter-spacing:-0.004em; }
  .hl .ln { display:inline-block; overflow:hidden; vertical-align:top; padding:0.05em 0.03em 0.03em 0.02em; margin:-0.05em -0.03em -0.03em -0.02em; }
  .hl .in { display:inline-block; }
  .hl .o { color:var(--orange); }
  .hl.big { font-size:150px; top:238px; }
  #h1, #h2, #h3, #h4 { top:300px; }
  .sub { position:absolute; left:120px; top:544px; width:780px; text-wrap:balance; margin:0; font:400 38px/1.32 "Pretendard", sans-serif; color:var(--soft); }
  #chain { position:absolute; left:120px; top:966px; height:40px; }
  #chain .lab { position:absolute; top:0; font:400 22px/30px "MesloLGS NF", monospace; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
  #chainbar { position:absolute; left:0; top:36px; height:4px; background:var(--orange); }
  .panel { position:absolute; background:var(--panel); border:2px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 34px 70px rgba(0,0,0,.55); }
  .hdr { position:absolute; left:0; right:0; top:0; height:46px; background:var(--panel2); border-bottom:2px solid var(--line); }
  .dots { position:absolute; left:18px; top:16px; height:12px; width:60px; }
  .dots i { position:absolute; top:0; width:12px; height:12px; border-radius:6px; background:#3a434f; }
  .ttl { position:absolute; left:0; right:0; top:0; height:46px; line-height:46px; text-align:center; font:400 18px/46px "MesloLGS NF", monospace; color:var(--muted); letter-spacing:.08em; }
  .body { position:absolute; left:0; right:0; top:46px; bottom:0; }
  .layer { position:absolute; left:0; top:0; width:746px; }
  .mono { font-family:"MesloLGS NF", monospace; }
  .prompt { position:absolute; left:34px; top:34px; width:650px; padding-left:40px; box-sizing:border-box; font:400 27px/1.55 "MesloLGS NF", monospace; color:var(--cream); white-space:pre-wrap; }
  .prompt .mk { position:absolute; left:0; top:0; color:var(--orange); }
  .prompt .ch { display:inline-block; }
  .cur { position:absolute; width:15px; height:31px; background:var(--lime); }
  .lab { font:700 20px/24px "Silkscreen", monospace; letter-spacing:.2em; text-transform:uppercase; }
  .row { position:absolute; left:44px; width:660px; height:64px; background:#151c25; border:2px solid #222a35; border-radius:12px; }
  .row .t { position:absolute; left:64px; top:0; line-height:60px; font:400 28px/60px "MesloLGS NF", monospace; color:var(--cream); }
  .row .g { position:absolute; right:22px; top:0; font:400 18px/60px "MesloLGS NF", monospace; color:var(--muted); }
  .chip { position:absolute; top:14px; width:212px; height:56px; background:#151c25; border:2px solid #222a35; border-radius:12px; }
  .chip .t { position:absolute; left:58px; top:0; font:400 25px/52px "MesloLGS NF", monospace; color:var(--cream); }
  .svgm { position:absolute; overflow:visible; }
  .rec { position:absolute; left:44px; width:660px; }
  .rec .k { position:absolute; left:0; top:0; font:400 20px/30px "MesloLGS NF", monospace; color:var(--muted); letter-spacing:.06em; }
  .rec .v { position:absolute; left:150px; top:-3px; font:400 27px/36px "MesloLGS NF", monospace; color:var(--cream); white-space:nowrap; }
  #browser { position:absolute; background:#f4f0e2; border:2px solid #cfc8b3; border-radius:16px; overflow:hidden; box-shadow:0 34px 70px rgba(0,0,0,.55); color:#17130b; }
  #browser .bh { position:absolute; left:0; right:0; top:0; height:46px; background:#e6dfca; border-bottom:2px solid #cfc8b3; }
  #browser .bh i { position:absolute; top:17px; width:12px; height:12px; border-radius:6px; background:#b9b19a; }
  #browser .pill { position:absolute; left:110px; right:110px; top:9px; height:28px; border-radius:14px; background:#f4f0e2; border:2px solid #cfc8b3; box-sizing:border-box; }
  .pg { font-family:"Pretendard", sans-serif; }
  .item { position:absolute; left:40px; width:668px; height:64px; overflow:hidden; }
  .ring { position:absolute; border-radius:50%; border:3px solid var(--orange); width:20px; height:20px; margin:-10px 0 0 -10px; }
  #hud { position:absolute; background:var(--panel); border:2px solid var(--line); border-radius:14px; overflow:hidden; }
  #hud .line { position:absolute; left:30px; top:0; height:92px; line-height:92px; font:400 25px/92px "MesloLGS NF", monospace; color:#5fd7ff; white-space:pre; }
  .glow { position:absolute; border-radius:50%; }
</style>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="vig"></div>
  <svg id="frame" width="1920" height="1080" viewBox="0 0 1920 1080">
    <path id="fr-top" d="M60 140H1860" stroke="#2a323c" stroke-width="2" fill="none"/>
    <path id="fr-bot" d="M60 940H1860" stroke="#2a323c" stroke-width="2" fill="none"/>
    <g stroke="#d8f552" stroke-width="2" opacity=".55" fill="none">
      <path d="M48 60H72M60 48V72"/><path d="M1848 60H1872M1860 48V72"/><path d="M48 1020H72M60 1008V1032"/><path d="M1848 1020H1872M1860 1008V1032"/>
    </g>
    <rect id="prog" x="60" y="138.5" width="0" height="3" fill="#d8f552"/>
  </svg>
  <img id="brand" src="wordmark.svg" alt="">

  <h1 class="hl" id="h1"></h1>
  <h1 class="hl" id="h2"></h1>
  <h1 class="hl" id="h3"></h1>
  <h1 class="hl" id="h4"></h1>
  <h1 class="hl big" id="h5"></h1>
  <p class="sub" id="s2" style="top:566px"></p>
  <p class="sub" id="s4" style="top:566px"></p>
  <p class="sub" id="s5" style="top:560px"></p>
  <div id="cta" class="abs" style="left:120px;top:704px;height:64px;"></div>

  <div id="chain"></div>

  <div id="browser" style="left:1050px;top:190px;width:750px;height:540px;">
    <div class="bh"><i style="left:18px"></i><i style="left:38px"></i><i style="left:58px"></i><div class="pill"></div></div>
    <div class="abs pg" style="left:0;top:46px;width:746px;height:490px;" id="bpage"></div>
  </div>

  <div id="panel" class="panel" style="left:1050px;top:320px;width:750px;height:300px;">
    <div class="hdr"><div class="dots"><i style="left:0"></i><i style="left:20px"></i><i style="left:40px"></i></div>
      <div class="ttl" id="tt1">claude</div><div class="ttl" id="tt2">goal</div><div class="ttl" id="tt3">checks</div><div class="ttl" id="tt4">handoff</div></div>
    <div class="body" id="pbody"></div>
  </div>

  <svg id="link" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="left:0;top:0;pointer-events:none">
    <path id="linkline" d="M1425 592V700" stroke="#d8f552" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path id="linkarrow" d="M1414 686L1425 700L1436 686" stroke="#d8f552" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div id="spark" class="abs" style="left:1416px;top:583px;width:18px;height:18px;border-radius:9px;background:#d8f552;box-shadow:0 0 22px 6px rgba(216,245,82,.55);"></div>
  <div id="nextlab" class="abs lab" style="left:1447px;top:630px;color:var(--orange);"></div>

  <div id="winb" class="panel" style="left:1050px;top:706px;width:750px;height:180px;">
    <div class="hdr"><div class="dots"><i style="left:0"></i><i style="left:20px"></i><i style="left:40px"></i></div><div class="ttl">claude</div></div>
    <div class="body" id="wbody"></div>
  </div>

  <div id="rings"></div>
  <div id="flamewrap" class="abs" style="left:1225px;top:210px;width:400px;height:500px;"></div>
  <div id="hud" style="left:1050px;top:780px;width:750px;height:96px;"><div class="line" id="hudline"></div></div>
  <div id="cursor" class="abs" style="left:0;top:0;width:34px;height:34px;">
    <svg width="34" height="34" viewBox="0 0 24 24"><path d="M4 2L4 19L8.6 14.6L11.6 21.4L14.4 20.2L11.5 13.6L18 13.4Z" fill="#f1ecdc" stroke="#070b10" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
</div>
<script>
const COPY = {
  h1: ["Ask for", "the work."],
  prompt1: "Build a to-do list in a single HTML file. lit",
  h2: ["Pin the", "goal."],
  s2: "Write the failing test first.",
  h3: ["Check the", "real page."],
  h4: ["Hand it", "off."],
  s4: "The next session reads the record and carries on.",
  promptB: "Read the handoff. What is next?",
  nextSession: "Next session",
  h5: ["Keep the", "work lit."],
  s5: "Plan, build and check your work in Claude Code.",
  cta: "npm install -g @litfamily/litclaude"
};
const { define, text, ease, at, kf, clipRect, drawPath, lerp, clamp, spring, mix } = LitStage;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const CREAM = "#f1ecdc", ORANGE = "#ff6a2a", LIME = "#d8f552", MUTED = "#9aa39a";

// ---------- headlines ----------
const H = [];
function buildHeadline(id, lines, accent, start, end) {
  const el = $(id);
  el.innerHTML = lines.map((l, i) => {
    let inner = l;
    if (accent && accent.line === i) inner = l.replace(accent.word, `<span class="o">${accent.word}</span>`);
    return `<span class="ln"><span class="in">${inner}</span></span>`;
  }).join("<br>");
  text(el);
  H.push({ el, ins: [...el.querySelectorAll(".in")], start, end });
}
buildHeadline("h1", COPY.h1, { line: 1, word: "work." }, -0.35, 5);
buildHeadline("h2", COPY.h2, { line: 1, word: "goal." }, 5, 10);
buildHeadline("h3", COPY.h3, { line: 1, word: "real page." }, 10, 15);
buildHeadline("h4", COPY.h4, { line: 1, word: "off." }, 15, 20);
buildHeadline("h5", COPY.h5, { line: 1, word: "lit." }, 20, 999);
for (const [id, k] of [["s2", "s2"], ["s4", "s4"], ["s5", "s5"]]) { $(id).textContent = COPY[k]; text($(id)); }
$("nextlab").textContent = COPY.nextSession; text($("nextlab"));
$("cta").innerHTML = `<div style="display:inline-block;height:64px;padding:0 26px;border:2px solid ${LIME};border-radius:12px;font:400 28px/60px 'MesloLGS NF',monospace;color:${LIME};white-space:nowrap;" id="ctatxt"></div>`;
$("ctatxt").textContent = COPY.cta; text($("ctatxt"));

// ---------- step chain (diagram) ----------
const chainLabels = ["Plan", "Build", "Check", "Hand off"];
const chainEl = $("chain");
const chainX = [];
{
  let x = 0;
  chainLabels.forEach((l, i) => {
    const s = document.createElement("span"); s.className = "lab"; s.textContent = l; s.style.left = x + "px"; chainEl.appendChild(s);
    text(s, { decor: true });
    const w = s.getBoundingClientRect().width; chainX.push({ x, w, s }); x += w;
    if (i < 3) {
      const a = document.createElementNS(NS, "svg"); a.setAttribute("class", "svgm"); a.setAttribute("width", "40"); a.setAttribute("height", "30"); a.style.left = (x + 12) + "px"; a.style.top = "0";
      a.innerHTML = '<path d="M4 15H30M23 8L30 15L23 22" stroke="#4a5563" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
      chainEl.appendChild(a); x += 64;
    }
  });
  const bar = document.createElement("div"); bar.id = "chainbar"; chainEl.appendChild(bar);
}
const chainBar = $("chainbar");
function chainActive(t) { return t < 5 ? -1 : t < 10 ? 0 : t < 12.5 ? 1 : t < 15 ? 2 : t < 20 ? 3 : 4; }

// ---------- glyph helpers ----------
const FLAME = (id, size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="overflow:visible"><defs><linearGradient id="fg${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffb02e"/></linearGradient></defs><path d="M12.6 1.5c.5 3.2-1 4.9-2.4 6.6C8.6 10 7 11.9 7 15a6 6 0 0 0 12 0c0-2.2-.9-3.8-2-5.2-.2 1.1-.8 2-1.8 2.4.5-3.6-.9-8.1-2.6-10.7z" fill="url(#fg${id})"/><path d="M12 22a3.5 3.5 0 0 1-3.5-3.5c0-1.8 1.2-2.8 2.1-3.9.5-.6.9-1.3.9-2.3 1.9 1.3 4 3.3 4 6.2A3.5 3.5 0 0 1 12 22z" fill="#ffe29a"/></svg>`;
function markSvg(parent, x, y, size) {
  const s = document.createElementNS(NS, "svg"); s.setAttribute("class", "svgm"); s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 36 36");
  s.style.left = x + "px"; s.style.top = y + "px";
  s.innerHTML = `<path class="c1" d="M9 9L27 27" stroke="${ORANGE}" stroke-width="4.5" stroke-linecap="round" fill="none"/><path class="c2" d="M27 9L9 27" stroke="${ORANGE}" stroke-width="4.5" stroke-linecap="round" fill="none"/><path class="tk" d="M7 19L15 27L30 9" stroke="${LIME}" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  parent.appendChild(s);
  const c1 = s.querySelector(".c1"), c2 = s.querySelector(".c2"), tk = s.querySelector(".tk");
  return { s, set(cross, tick) { drawPath(c1, clamp(cross * 2)); drawPath(c2, clamp(cross * 2 - 1)); drawPath(tk, tick); c1.style.opacity = c2.style.opacity = cross > 0.001 ? 1 : 0; tk.style.opacity = tick > 0.001 ? 1 : 0; } };
}

// ---------- terminal panel layers ----------
const pbody = $("pbody");
// L1: prompt
const L1 = document.createElement("div"); L1.className = "layer"; L1.style.height = "260px"; pbody.appendChild(L1);
const promptEl = document.createElement("div"); promptEl.className = "prompt";
promptEl.innerHTML = '<span class="mk">&gt;</span>';
L1.appendChild(promptEl);
function makeTyper(container, str, limeFrom) {
  const spans = [];
  const holder = document.createElement("span"); container.appendChild(holder);
  let word = null;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === " ") { holder.appendChild(document.createTextNode(" ")); spans.push(null); word = null; continue; }
    if (!word) { word = document.createElement("span"); word.style.whiteSpace = "nowrap"; word.style.display = "inline-block"; holder.appendChild(word); }
    const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; if (limeFrom !== undefined && i >= limeFrom) sp.style.color = LIME;
    word.appendChild(sp); spans.push(sp);
  }
  return spans;
}
const typed1 = makeTyper(promptEl, COPY.prompt1, COPY.prompt1.length - 3);
text(promptEl);
const cur1 = document.createElement("div"); cur1.className = "cur"; promptEl.appendChild(cur1);
const litBar = document.createElement("div"); litBar.className = "abs"; litBar.style.cssText = `height:4px;background:${LIME};left:0;top:0;width:0`; promptEl.appendChild(litBar);
function typeStep(spans, cur, t, start, cps, blink) {
  let last = -1;
  for (let i = 0; i < spans.length; i++) {
    const on = t >= start + i / cps;
    if (spans[i]) spans[i].style.opacity = on ? 1 : 0;
    if (on) last = i;
  }
  let l = 0, tp = 0;
  const ref = last >= 0 ? (() => { for (let j = last; j >= 0; j--) if (spans[j]) return spans[j]; return null; })() : null;
  if (ref) { l = ref.offsetLeft + ref.offsetWidth; tp = ref.offsetTop; }
  else { l = 40; tp = 0; }
  cur.style.left = l + 2 + "px"; cur.style.top = tp + 2 + "px";
  cur.style.opacity = t < start ? 0 : (last >= spans.length - 1 ? (Math.floor(t * 2.4) % 2 === 0 ? 1 : 0.15) : 1);
}

// L2: goal card
const L2 = document.createElement("div"); L2.className = "layer"; L2.style.height = "594px"; pbody.appendChild(L2);
L2.innerHTML = `
  <div class="lab abs" style="left:44px;top:34px;color:${ORANGE}" id="g-lab">Goal</div>
  <div class="abs pg" style="left:44px;top:70px;width:670px;font:700 34px/44px 'Pretendard',sans-serif;color:${CREAM};" id="g-title">To-do list in one HTML file</div>
  <div class="abs mono" style="left:44px;top:122px;font:400 20px/26px 'MesloLGS NF',monospace;color:${MUTED};" id="g-sub">no external dependencies</div>
  <div class="abs" id="g-rule" style="left:44px;top:176px;width:660px;height:2px;background:#2a323c;transform-origin:0 0;"></div>
  <div class="lab abs" style="left:44px;top:200px;color:${MUTED};font-size:18px" id="g-checks">Checks</div>
  <div class="abs mono" id="g-chip" style="left:520px;top:194px;height:34px;padding:0 14px;border:2px solid ${ORANGE};border-radius:17px;font:400 17px/30px 'MesloLGS NF',monospace;color:${CREAM};">written first</div>`;
const goalRows = ["add", "complete", "delete"].map((name, i) => {
  const r = document.createElement("div"); r.className = "row"; r.style.top = 250 + i * 80 + "px";
  r.innerHTML = `<div class="t">${name}</div><div class="g">fails</div>`;
  L2.appendChild(r);
  const m = markSvg(r, 14, 12, 36);
  return { r, m };
});
for (const id of ["g-lab", "g-title", "g-sub", "g-checks", "g-chip"]) text($(id), { decor: true });
goalRows.forEach(({ r }) => { text(r.querySelector(".t"), { decor: true }); text(r.querySelector(".g"), { decor: true }); });

// L3: strip
const L3 = document.createElement("div"); L3.className = "layer"; L3.style.height = "84px"; pbody.appendChild(L3);
const chips = ["add", "complete", "delete"].map((name, i) => {
  const c = document.createElement("div"); c.className = "chip"; c.style.left = 28 + i * 238 + "px"; c.innerHTML = `<div class="t">${name}</div>`;
  L3.appendChild(c); const m = markSvg(c, 12, 9, 34); text(c.querySelector(".t"), { decor: true }); return { c, m };
});

// L4: record
const L4 = document.createElement("div"); L4.className = "layer"; L4.style.height = "354px"; pbody.appendChild(L4);
const recRows = [["goal", "To-do list in one HTML file", 36], ["checked", "add · complete · delete", 112], ["next", "keyboard shortcuts", 188]].map(([k, v, y]) => {
  const d = document.createElement("div"); d.className = "rec"; d.style.top = y + "px"; d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`; L4.appendChild(d);
  text(d.querySelector(".k"), { decor: true }); text(d.querySelector(".v"), { decor: true }); return d;
});
const recTicks = [0, 1, 2].map((i) => { const m = markSvg(L4, 610 + i * 34, 106, 30); return m; });
const folder = document.createElement("div"); folder.className = "abs"; folder.style.cssText = "left:44px;top:276px;height:40px;";
folder.innerHTML = `<svg width="30" height="26" viewBox="0 0 30 26" style="position:absolute;left:0;top:4px"><path d="M2 5.5H11L14 9H28V23H2Z" fill="none" stroke="${LIME}" stroke-width="2.4" stroke-linejoin="round"/></svg><div class="mono" id="folder-t" style="position:absolute;left:44px;top:0;font:400 23px/34px 'MesloLGS NF',monospace;color:${LIME};white-space:nowrap;">.litclaude/litgoal/</div>`;
L4.appendChild(folder); text($("folder-t"), { decor: true });
const folderRule = document.createElement("div"); folderRule.className = "abs"; folderRule.style.cssText = "left:44px;top:258px;width:660px;height:2px;background:#2a323c;transform-origin:0 0;"; L4.appendChild(folderRule);

// ---------- browser page ----------
const bpage = $("bpage");
bpage.innerHTML = `
  <div class="abs" style="left:40px;top:28px;font:700 46px/56px 'Pretendard',sans-serif;color:#17130b;" id="b-title">To-do</div>
  <div class="abs" id="b-input" style="left:40px;top:104px;width:492px;height:64px;border:3px solid #17130b;border-radius:12px;box-sizing:border-box;background:#fbf9f1;"></div>
  <div class="abs pg" id="b-ph" style="left:60px;top:104px;font:400 28px/64px 'Pretendard',sans-serif;color:#8b846f;">What needs doing?</div>
  <div class="abs pg" id="b-typed" style="left:60px;top:104px;font:400 28px/64px 'Pretendard',sans-serif;color:#17130b;white-space:pre;"></div>
  <div class="abs" id="b-btn" style="left:548px;top:104px;width:160px;height:64px;border-radius:12px;background:${ORANGE};font:700 28px/64px 'Pretendard',sans-serif;color:#17130b;text-align:center;">Add</div>
  <div class="abs" id="b-list" style="left:0;top:196px;width:746px;height:260px;"></div>`;
for (const id of ["b-title", "b-ph", "b-typed", "b-btn"]) text($(id), { decor: true });

<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<!--
  LitClaude promo film, set in Pretendard 400 and 700; MesloLGS NF only for what a terminal prints.
  Copy lives in COPY below. LANG picks the English or the Korean lines; the Korean film is the same
  page with LANG = "ko" and the matching treatment file.
-->
<style>
  :root { --bg:#06080b; --cream:#f2efdf; --orange:#ff6337; --dim:#6b6961; --ember:#ffb066; --muted:#a19e92; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; font-synthesis:none; }
  .abs { position:absolute; }
  #ambient { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  #vig { position:absolute; left:0; top:0; width:1920px; height:1080px; background:radial-gradient(ellipse 80% 80% at 50% 50%, rgba(6,8,11,0) 52%, rgba(6,8,11,.62) 100%); }
  #hero { position:absolute; left:0; top:0; margin:0; font:700 720px/1 "Pretendard", sans-serif; letter-spacing:-0.03em; white-space:nowrap; transform-origin:0 0; color:#8a877d; }
  #hero span { display:inline-block; }
  #lead { position:absolute; left:0; width:1920px; text-align:center; top:118px; font:400 62px/1.2 "Pretendard", sans-serif; color:var(--muted); white-space:nowrap; }
  #prompt { position:absolute; top:936px; font:400 36px/44px "MesloLGS NF", monospace; white-space:pre; color:var(--cream); }
  #prompt .o { color:var(--orange); }
  #promptlit { position:absolute; top:936px; font:400 36px/44px "MesloLGS NF", monospace; white-space:pre; color:var(--orange); }
  #caret { position:absolute; width:20px; height:40px; background:var(--orange); top:938px; }
  .hl { position:absolute; left:140px; margin:0; font:700 172px/1.02 "Pretendard", sans-serif; letter-spacing:-0.03em; color:var(--cream); white-space:nowrap; }
  .hl.ko { font-size:140px; letter-spacing:0; line-height:1.12; }
  .hl .ln { display:block; overflow:hidden; padding:0.07em 0.04em 0.1em 0.02em; margin:-0.07em -0.04em -0.1em -0.02em; }
  .hl .in { display:block; }
  .hl b { font-weight:700; color:var(--orange); }
  .mono { font-family:"MesloLGS NF", monospace; }
  .row { position:absolute; left:0; top:0; width:680px; height:96px; transform-origin:0 0; }
  .row .lab { position:absolute; left:104px; top:0; font:400 46px/96px "MesloLGS NF", monospace; color:var(--cream); white-space:nowrap; }
  .row .hair { position:absolute; left:0; top:114px; width:680px; height:2px; background:rgba(242,239,223,.14); }
  .ring { position:absolute; left:0; top:0; width:64px; height:64px; overflow:visible; transform-origin:32px 32px; }
  #page { position:absolute; left:1100px; top:170px; width:680px; height:560px; background:#f2efdf; border-radius:24px; overflow:hidden; color:#15120c; box-shadow:0 40px 90px rgba(0,0,0,.6); font-family:"Pretendard", sans-serif; }
  #page .bar i { position:absolute; top:22px; width:12px; height:12px; border-radius:6px; background:#c9c2ab; }
  #page .ttl { position:absolute; left:44px; top:76px; font:700 46px/56px "Pretendard", sans-serif; }
  #page .inp { position:absolute; left:44px; top:160px; width:440px; height:64px; border-radius:16px; border:3px solid #cfc8b3; box-sizing:border-box; }
  #page .inp span { position:absolute; left:20px; top:0; font:400 30px/58px "Pretendard", sans-serif; color:#3a352a; white-space:nowrap; }
  #page .btn { position:absolute; left:504px; top:160px; width:132px; height:64px; border-radius:16px; background:#ff6337; color:#1a0f08; font:700 30px/64px "Pretendard", sans-serif; text-align:center; }
  #page .item { position:absolute; left:44px; top:262px; width:592px; height:72px; transform-origin:50% 0; }
  #page .item .box { position:absolute; left:8px; top:21px; width:30px; height:30px; border-radius:9px; border:3px solid #b9b198; box-sizing:border-box; }
  #page .item .t { position:absolute; left:64px; top:0; font:400 32px/72px "Pretendard", sans-serif; }
  #page .item .x { position:absolute; right:14px; top:0; font:400 40px/68px "Pretendard", sans-serif; color:#6b644f; }
  #page .item .strike { position:absolute; left:64px; top:35px; height:3px; width:132px; background:#15120c; transform-origin:0 50%; }
  #rec { position:absolute; left:1100px; top:190px; width:680px; height:400px; box-sizing:border-box; border-radius:24px; background:#0c1014; border:2px solid rgba(242,239,223,.22); }
  #rec .rtitle { position:absolute; left:28px; top:20px; font:400 24px/32px "MesloLGS NF", monospace; color:var(--muted); }
  #rec .k { position:absolute; left:28px; font:400 26px/40px "MesloLGS NF", monospace; color:var(--muted); }
  #rec .v { position:absolute; left:238px; font:400 26px/40px "MesloLGS NF", monospace; color:var(--cream); white-space:nowrap; }
  #pane { position:absolute; left:1100px; top:700px; width:680px; height:190px; box-sizing:border-box; border-radius:24px; background:#0c1014; border:2px solid rgba(242,239,223,.22); overflow:hidden; }
  #pane i { position:absolute; top:22px; width:12px; height:12px; border-radius:6px; background:#3a3f45; }
  #panetext { position:absolute; left:32px; top:92px; font:400 34px/44px "MesloLGS NF", monospace; color:var(--cream); white-space:pre; }
  #panetext .o { color:var(--orange); }
  #panecaret { position:absolute; top:94px; width:19px; height:38px; background:var(--orange); }
  #tag { position:absolute; left:140px; top:704px; width:900px; margin:0; font:400 48px/1.32 "Pretendard", sans-serif; color:#d8d4c4; text-wrap:balance; }
  #cmd { position:absolute; left:140px; top:872px; height:64px; padding:0 26px; border-radius:16px; border:2px solid rgba(242,239,223,.28); box-sizing:border-box; font:400 34px/60px "MesloLGS NF", monospace; color:var(--cream); white-space:pre; }
  #cmd .o { color:var(--orange); }
  #hud { position:absolute; left:1100px; top:800px; width:680px; height:84px; box-sizing:border-box; border-radius:20px; background:#0c1014; border:2px solid rgba(242,239,223,.22); }
  #hudline { position:absolute; left:24px; top:0; height:80px; font:400 20px/80px "MesloLGS NF", monospace; color:#5fd7ff; white-space:pre; }
  #hudline .o { color:var(--orange); }
  #hudline svg { display:inline-block; width:26px; height:26px; vertical-align:-5px; }
  svg { overflow:visible; }
</style>
<body>
<div id="stage">
  <div id="ambient"></div>
  <div id="vig"></div>

  <svg id="track" class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
    <line id="track-base" x1="140" y1="1004" x2="1780" y2="1004" stroke="#6b6961" stroke-opacity=".35" stroke-width="2"/>
    <g id="track-ticks" stroke="#6b6961" stroke-opacity=".7" stroke-width="2"></g>
    <line id="track-fill" x1="140" y1="1004" x2="140" y2="1004" stroke="#ff6337" stroke-width="4" stroke-linecap="round"/>
    <circle id="track-head" cx="140" cy="1004" r="7" fill="#ff6337"/>
  </svg>

  <div id="lead"></div>
  <div id="hero"></div>
  <svg id="emberlayer" class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs><radialGradient id="halo"><stop offset="0" stop-color="#ff6337" stop-opacity=".95"/><stop offset=".45" stop-color="#ff6337" stop-opacity=".35"/><stop offset="1" stop-color="#ff6337" stop-opacity="0"/></radialGradient></defs>
    <circle id="ember-halo" cx="0" cy="0" r="100" fill="url(#halo)"/>
    <circle id="ember-core" cx="0" cy="0" r="10" fill="#ff6337"/>
  </svg>
  <div id="prompt"></div>
  <div id="promptlit"></div>
  <div id="caret"></div>

  <div id="heads"></div>

  <div id="rows"></div>

  <div id="page">
    <div class="bar"><i style="left:26px"></i><i style="left:46px"></i><i style="left:66px"></i></div>
    <div class="ttl" id="pg-title"></div>
    <div class="inp"><span id="pg-input"></span></div>
    <div class="btn" id="pg-add"></div>
    <div class="item" id="pg-item">
      <div class="box" id="pg-box"><svg width="30" height="30" viewBox="0 0 30 30" style="position:absolute;left:-3px;top:-3px"><path id="pg-tick" d="M7 15L13 21L23 9" fill="none" stroke="#fff8ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t" id="pg-text"></div>
      <div class="strike" id="pg-strike"></div>
      <div class="x">×</div>
    </div>
  </div>
  <svg id="cursorlayer" class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
    <circle id="click-a" r="18" fill="none" stroke="#ff6337" stroke-width="4" opacity="0"/>
    <circle id="click-b" r="18" fill="none" stroke="#ff6337" stroke-width="4" opacity="0"/>
    <circle id="click-c" r="18" fill="none" stroke="#ff6337" stroke-width="4" opacity="0"/>
    <g id="cursor"><path d="M0 0L0 32L8.5 24.5L14.5 37.5L21 34.5L15 21.5L26.5 21.5Z" fill="#f2efdf" stroke="#06080b" stroke-width="2.5" stroke-linejoin="round"/></g>
  </svg>

  <div id="rec">
    <div class="rtitle" id="rec-title"></div>
    <div class="k" style="top:70px" id="rk1"></div><div class="v" style="top:70px" id="rv1"></div>
    <div class="k" style="top:144px" id="rk2"></div><div class="v" style="top:144px" id="rv2"></div>
    <div class="k" style="top:218px" id="rk3"></div>
    <div class="k" style="top:292px" id="rk4"></div><div class="v" style="top:292px" id="rv4"></div>
  </div>
  <div id="rings"></div>
  <svg id="sparklayer" class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
    <path id="spark-line" d="M1440 592L1440 700" stroke="#ff6337" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    <circle id="spark-halo" r="34" fill="url(#halo)"/>
    <circle id="spark" r="9" fill="#ff6337"/>
  </svg>
  <div id="pane"><i style="left:26px"></i><i style="left:46px"></i><i style="left:66px"></i><div id="panetext"></div><div id="panecaret"></div></div>

  <div id="flameglow" class="abs" style="left:1063px;top:230px;width:800px;height:640px;"></div>
  <svg id="flame" class="abs" style="left:1160px;top:190px" width="560" height="560" viewBox="0 0 24 24">
    <defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ff9a3a"/></linearGradient></defs>
    <path d="M12.6 1.5c.5 3.2-1 4.9-2.4 6.6C8.6 10 7 11.9 7 15a6 6 0 0 0 12 0c0-2.2-.9-3.8-2-5.2-.2 1.1-.8 2-1.8 2.4.5-3.6-.9-8.1-2.6-10.7z" fill="url(#fg)"/>
    <path d="M12 22a3.5 3.5 0 0 1-3.5-3.5c0-1.8 1.2-2.8 2.1-3.9.5-.6.9-1.3.9-2.3 1.9 1.3 4 3.3 4 6.2A3.5 3.5 0 0 1 12 22z" fill="#ffd9a0"/>
  </svg>
  <div id="hud"><div id="hudline"></div></div>
  <p id="tag"></p>
  <div id="cmd"></div>
</div>

<script>
const LANG = "en";
if (LANG === "ko") document.body.style.wordBreak = "keep-all";
const COPY = {
  en: {
    lead: "End any request with",
    hero: "lit",
    h2: ["Pin the", "<b>goal.</b>"],
    h3: ["Fail <b>first.</b>"],
    h4: ["Check the", "<b>real page.</b>"],
    h5: ["Hand it", "<b>on.</b>"],
    h6: ["Keep the", "work <b>lit.</b>"],
    tag: "Plan, build and check your work in Claude Code.",
    cmd: "npm install -g @litfamily/litclaude",
  },
  ko: {
    lead: "모든 요청 끝에",
    hero: "lit",
    h2: ["목표를", "<b>고정합니다.</b>"],
    h3: ["실패하는", "<b>테스트부터.</b>"],
    h4: ["실제 화면을", "<b>확인합니다.</b>"],
    h5: ["다음 세션으로", "<b>넘깁니다.</b>"],
    h6: ["Keep the", "work <b>lit.</b>"],
    tag: "확인한 일을 다음 세션으로 이어가세요.",
    cmd: "npm install -g @litfamily/litclaude",
  },
}[LANG];
// What a terminal, a page or a record would print. Drawn objects, not copy.
const DEMO = {
  prompt: "Build a to-do list in one HTML file. ",
  ask: "lit",
  rows: ["add", "complete", "delete"],
  pageTitle: "To-do", pageInput: "Buy milk", pageAdd: "Add",
  recTitle: ".litclaude/litgoal/",
  rk: ["goal", "checked", "result", "next"],
  rv: ["to-do list, one file", "add · complete · delete", "", "keyboard shortcuts"],
  pane: "Read the handoff.",
};

const { define, text, ease, at, kf, clipRect, drawPath, lerp, clamp, mix, rgba, spring } = LitStage;
const DUR = 22;
const CUT = [4.2, 7.4, 10.4, 14.4, 17.8];
const C = { bg: "#06080b", cream: "#f2efdf", orange: "#ff6337", dim: "#6b6961", ember: "#ffb066", muted: "#a19e92" };
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const setVis = (el, on) => { el.style.visibility = on ? "visible" : "hidden"; };

// ---- hero word ----
const hero = $("hero");
hero.innerHTML = [...COPY.hero].map((ch) => `<span>${ch}</span>`).join("");
text(hero);
const heroLetters = [...hero.children];
const HERO_FS = 720;
const heroW = hero.getBoundingClientRect().width;
const HX0 = (1920 - heroW) / 2, HY0 = 150;
const MARK_FS = 46, MARK_S = MARK_FS / HERO_FS, MARK_X = 140, MARK_Y = 72;
// The dot of the i, where the ember sits (fractions of the font size, measured on the i box).
const iBox = heroLetters[1].getBoundingClientRect();
const DOT = { x: HX0 + (iBox.left - hero.getBoundingClientRect().left) + iBox.width * 0.5 + HERO_FS * 0.0153, y: HY0 + HERO_FS * 0.182, r: HERO_FS * 0.0785 };

const lead = $("lead"); lead.textContent = COPY.lead; text(lead);

// ---- prompt (decor) ----
const prompt = $("prompt"); text(prompt, { decor: true });
const promptlit = $("promptlit"); text(promptlit);
const CHW = 36 * 0.6;
const promptFull = "> " + DEMO.prompt + DEMO.ask;
const PX = (1920 - promptFull.length * CHW) / 2;
prompt.style.left = PX + "px";
promptlit.style.left = PX + (2 + DEMO.prompt.length) * CHW + "px";
const caret = $("caret");

// ---- headlines ----
const heads = {};
for (const [id, lines] of [["h2", COPY.h2], ["h3", COPY.h3], ["h4", COPY.h4], ["h5", COPY.h5], ["h6", COPY.h6]]) {
  const h = document.createElement("h1");
  h.className = "hl" + (LANG === "ko" && id !== "h6" ? " ko" : "");
  h.innerHTML = lines.map((l) => `<span class="ln"><span class="in">${l}</span></span>`).join(" ");
  const single = lines.length === 1;
  const fs = id === "h6" ? 196 : LANG === "ko" ? 140 : single ? 214 : 172;
  if (fs !== 172 && !(LANG === "ko" && id !== "h6")) h.style.fontSize = fs + "px";
  const n = lines.length;
  const lh = LANG === "ko" && id !== "h6" ? 1.12 : 1.02;
  h.style.top = (id === "h6" ? 236 : 520 - (n * fs * lh) / 2) + "px";
  $("heads").appendChild(h);
  text(h);
  heads[id] = { el: h, ins: [...h.querySelectorAll(".in")] };
}
function head(h, tin, tout, t) {
  h.ins.forEach((el, i) => {
    if (LANG === "ko") {
      // Dense Hangul keeps its strokes almost still while it fades, which the flash audit prefers to a fast mask.
      const kin = at(t, tin + i * 0.09, 0.75, ease.outCubic);
      const kout = tout == null ? 0 : at(t, tout + i * 0.04, 0.34, ease.inOutSine);
      el.style.transform = `translateY(${(1 - kin) * 26}%)`;
      el.style.opacity = String(kin * (1 - kout));
      return;
    }
    const pin = at(t, tin + i * 0.09, 0.8, ease.outQuint);
    const pout = tout == null ? 0 : at(t, tout + i * 0.04, 0.36, ease.inCubic);
    el.style.transform = `translateY(${(1 - pin) * 112 - pout * 112}%)`;
  });
  setVis(h.el, t >= tin - 0.02 && (tout == null || t <= tout + 0.5));
}

// ---- rows and rings ----
const ROW_X = 1100, ROW_Y = [408 - 48, 540 - 48, 672 - 48], CHIP_S = 0.66, CHIP_Y = 902 - 48 * CHIP_S;
const CHIP_X = [1100, 1283, 1557];
const rowEls = [], ringEls = [];
DEMO.rows.forEach((name, i) => {
  const r = document.createElement("div");
  r.className = "row";
  r.innerHTML = `<div class="lab">${name}</div><div class="hair"></div>`;
  $("rows").appendChild(r);
  text(r.querySelector(".lab"), { decor: true });
  rowEls.push({ el: r, lab: r.querySelector(".lab"), hair: r.querySelector(".hair") });
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("class", "ring");
  s.setAttribute("viewBox", "0 0 64 64");
  s.innerHTML = `<circle class="fill" cx="32" cy="32" r="27" fill="#f2efdf" opacity="0"/><circle class="rg" cx="32" cy="32" r="27" fill="none" stroke="#6b6961" stroke-width="4"/>
    <path class="x1" d="M22 22L42 42" stroke="#ff6337" stroke-width="5" stroke-linecap="round" fill="none"/><path class="x2" d="M42 22L22 42" stroke="#ff6337" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path class="tk" d="M19 33L28 42L45 23" stroke="#06080b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  $("rings").appendChild(s);
  ringEls.push({ el: s, fill: s.querySelector(".fill"), rg: s.querySelector(".rg"), x1: s.querySelector(".x1"), x2: s.querySelector(".x2"), tk: s.querySelector(".tk") });
});
const TF = [7.95, 8.25, 8.55];         // the crosses draw
const TP = [12.1, 13.05, 13.95];       // the ticks land, just after each click
const REC_RING = (i) => [1100 + 238 + 28 + i * 66, 190 + 218 + 20];
function ringPose(i, t) {
  const a = at(t, 10.5 + i * 0.06, 0.75, ease.inOutCubic);
  const b = at(t, 14.6 + i * 0.1, 0.8, ease.inOutCubic);
  const rowX = lerp(ROW_X, CHIP_X[i], a), rowY = lerp(ROW_Y[i], CHIP_Y, a), s = lerp(1, CHIP_S, a);
  const cx = rowX + 32 * s, cy = rowY + 48 * s;
  const rr = REC_RING(i);
  const col = at(t, 17.4, 0.62, ease.inOutCubic);
  return { rowX, rowY, s, cx: lerp(lerp(cx, rr[0], b), 1463, col), cy: lerp(lerp(cy, rr[1], b), 700, col), sc: lerp(s, 0.86, b) * (1 - col * 0.97) };
}

// ---- page (decor) ----
const page = $("page");
$("pg-title").textContent = DEMO.pageTitle; $("pg-add").textContent = DEMO.pageAdd; $("pg-text").textContent = DEMO.pageInput;
for (const id of ["pg-title", "pg-add", "pg-text", "pg-input"]) text($(id), { decor: true });
const CLICKS = [[1672, 364, 12.05, "click-a"], [1176, 464, 13.0, "click-b"], [1703, 464, 13.9, "click-c"]];

// ---- record, spark, pane (decor) ----
$("rec-title").textContent = DEMO.recTitle; text($("rec-title"));
DEMO.rk.forEach((k, i) => { $("rk" + (i + 1)).textContent = k; text($("rk" + (i + 1)), { decor: true }); });
[1, 2, 4].forEach((n, j) => { const el = $("rv" + n); el.textContent = DEMO.rv[n - 1]; text(el, { decor: true }); });
const pane = $("pane"), panetext = $("panetext"), panecaret = $("panecaret"); text(panetext, { decor: true });
const rec = $("rec");

// ---- close ----
const flame = $("flame"), flameglow = $("flameglow");
const tag = $("tag"); tag.textContent = COPY.tag; text(tag);
const cmd = $("cmd"); cmd.innerHTML = `<span class="o">$ </span>${COPY.cmd}`; text(cmd);
const hud = $("hud"), hudline = $("hudline"); text(hudline);
const FL = '<svg viewBox="0 0 24 24"><path d="M12.6 1.5c.5 3.2-1 4.9-2.4 6.6C8.6 10 7 11.9 7 15a6 6 0 0 0 12 0c0-2.2-.9-3.8-2-5.2-.2 1.1-.8 2-1.8 2.4.5-3.6-.9-8.1-2.6-10.7z" fill="#ff7a2a"/><path d="M12 22a3.5 3.5 0 0 1-3.5-3.5c0-1.8 1.2-2.8 2.1-3.9.5-.6.9-1.3.9-2.3 1.9 1.3 4 3.3 4 6.2A3.5 3.5 0 0 1 12 22z" fill="#ffd9a0"/></svg>';
hudline.innerHTML = `[${FL}LITCLAUDE] <span class="o">${FL} LIT IGNITED · lit-loop ${FL}</span> | O5.5`;
const flameSpring = spring({ stiffness: 90, damping: 11 });

// ---- progress track ----
const ticks = $("track-ticks");
for (const c of CUT) { const x = 140 + (1640 * c) / DUR; const l = document.createElementNS(NS, "line"); l.setAttribute("x1", x); l.setAttribute("x2", x); l.setAttribute("y1", 996); l.setAttribute("y2", 1012); ticks.appendChild(l); }

function render(t) {
  // ambient light: the room warms as the work becomes true
  const glowA = kf(t, [{ t: 0, v: 0 }, { t: 2.0, v: 0, ease: "inOutSine" }, { t: 4.4, v: 0.12 }, { t: 17.8, v: 0.19, ease: "inOutSine" }, { t: 19.2, v: 0.30 }, { t: 22, v: 0.30 }]);

  promptlit.textContent = shownAsk;
  const count = p1.length + nMain + nAsk;

  const typing = t > 0.3 && t < 1.9;
  const blink = typing ? 1 : Math.floor(t * 2) % 2 === 0 ? 1 : 0.15;
  const promptOut = at(t, 3.85, 0.35, ease.inCubic);
  prompt.style.opacity = String(1 - promptOut); promptlit.style.opacity = String(1 - promptOut);
  caret.style.opacity = String((1 - promptOut) * blink * (t < 2.5 ? 1 : 0));
  setVis(prompt, t < 4.3); setVis(promptlit, t < 4.3 && nAsk > 0); setVis(caret, t < 4.3);
  lead.style.opacity = String(1 - at(t, 3.8, 0.35, ease.inCubic));

  setVis(lead, t < 4.3);

  heroLetters.forEach((s, i) => {

  });
  const hp = at(t, 3.75, 1.3, ease.inOutCubic);
  const hs = Math.exp(lerp(0, Math.log(MARK_S), hp));
  const hx = lerp(HX0, MARK_X, hp), hy = lerp(HY0, MARK_Y, hp);
  hero.style.transform = `translate(${hx}px, ${hy}px) scale(${hs})`;
  hero.style.opacity = String(kf(t, [{ t: 3.75, v: 1, ease: "outCubic" }, { t: 4.1, v: 0.3 }, { t: 4.6, v: 0.3, ease: "inOutSine" }, { t: 5.05, v: 1 }]));
  // ember on the dot of the i
  const breathe = 0.82 + 0.18 * Math.sin(t * 5.2);
  const flare = at(t, 1.85, 0.6, ease.outCubic) * (1 - at(t, 2.9, 1.0, ease.inOutSine));
  const eh = $("ember-halo"), ec = $("ember-core");
  const ex = hx + (DOT.x - HX0) * hs, ey = hy + (DOT.y - HY0) * hs;
  const er = DOT.r * hs;
  ec.setAttribute("cx", ex); ec.setAttribute("cy", ey); ec.setAttribute("r", er * 1.03);
  ec.setAttribute("opacity", String((t < 1.95 ? breathe : 1) * (t < 3.75 ? 1 : kf(t, [{ t: 3.75, v: 1 }, { t: 4.1, v: 0.3 }, { t: 4.6, v: 0.3 }, { t: 5.05, v: 1 }]))));
  eh.setAttribute("cx", ex); eh.setAttribute("cy", ey);
  eh.setAttribute("r", er * 2.6 + flare * DOT.r * 6);
  eh.setAttribute("opacity", String((t < 1.85 ? 0.16 * breathe : 0.16 * (1 - at(t, 2.7, 1.2)) + 0.2 * flare) * (t > 4.6 ? 0 : 1)));
  setVis($("emberlayer"), t < 5.1);

  // ---- headlines ----
  head(heads.h2, CUT[0] + 0.16, CUT[1] - 0.34, t);
  head(heads.h3, CUT[1] + 0.16, CUT[2] - 0.34, t);
  head(heads.h4, CUT[2] + 0.16, CUT[3] - 0.34, t);
  head(heads.h5, CUT[3] + 0.16, CUT[4] - 0.34, t);
  head(heads.h6, CUT[4] + 0.2, null, t);

  // ---- rows, rings ----

    const pose = ringPose(i, t);
    const enter = at(t, 4.6 + i * 0.12, 0.7, ease.outCubic);
    const chipsA = at(t, 10.5 + i * 0.06, 0.75, ease.inOutCubic);
    r.el.style.transform = `translate(${pose.rowX + (1 - enter) * 40}px, ${pose.rowY}px) scale(${pose.s})`;
    r.el.style.opacity = String(enter * (1 - at(t, 14.45, 0.25)));

    r.lab.style.color = kf(t, [{ t: TF[i] - 0.05, v: C.muted }, { t: TF[i] + 0.25, v: C.cream }]);

    ring.el.style.opacity = String(enter * (1 - at(t, 17.62, 0.22, ease.inCubic)));

    ring.rg.setAttribute("stroke", stroke);
    ring.fill.setAttribute("opacity", String(at(t, TP[i], 0.3, ease.outCubic)));
    const crossP = at(t, TF[i], 0.42, ease.outCubic);
    const crossOut = 1 - at(t, TP[i], 0.14);
    for (const [k, path] of [[0, ring.x1], [1, ring.x2]]) {
      const p = clamp((crossP - k * 0.35) / 0.65);

      path.style.opacity = String(p <= 0 ? 0 : crossOut);

    const tp = at(t, TP[i] + 0.06, 0.3, ease.outCubic);
    drawPath(ring.tk, tp); ring.tk.style.opacity = String(tp <= 0 ? 0 : 1);
    void chipsA;
  });

  // ---- page and cursor ----
  const pIn = LANG === "ko" ? at(t, 10.85, 0.65, ease.outQuint) : at(t, 10.65, 0.85, ease.outQuint);
  const pOut = at(t, 14.0, 0.4, ease.inOutCubic);
  clipRect(page, pIn * (1 - pOut), { from: "bottom" });
  page.style.transform = `translateY(${(1 - pIn) * 60 + pOut * -20}px)`;
  setVis(page, t > 10.6 && t < 14.5);
  const nIn = Math.floor(clamp((t - 11.3) / 0.6) * DEMO.pageInput.length + 1e-6);
  $("pg-input").textContent = t < CLICKS[0][2] ? DEMO.pageInput.slice(0, nIn) : "";
  const itemIn = at(t, 12.1, 0.4, ease.outCubic);
  const itemOut = at(t, CLICKS[2][2], 0.4, ease.inCubic);
  const item = $("pg-item");
  item.style.opacity = String(itemIn * (1 - itemOut));
  item.style.transform = `translateY(${(1 - itemIn) * -14}px) scaleY(${1 - itemOut})`;
  const checked = at(t, CLICKS[1][2], 0.25, ease.outCubic);
  $("pg-box").style.background = mix("#f2efdf", C.orange, checked);
  $("pg-box").style.borderColor = mix("#b9b198", C.orange, checked);
  drawPath($("pg-tick"), at(t, CLICKS[1][2] + 0.08, 0.25, ease.outCubic)); $("pg-tick").style.opacity = String(checked <= 0 ? 0 : 1);
  $("pg-strike").style.transform = `scaleX(${at(t, CLICKS[1][2] + 0.1, 0.35, ease.outCubic)})`;
  $("pg-text").style.color = mix("#15120c", "#6b644f", checked);
  const cpos = kf(t, [
    { t: 11.25, v: [1745, 700], ease: "inOutCubic" }, { t: 11.95, v: [1672, 364] }, { t: 12.15, v: [1672, 364], ease: "inOutCubic" },
    { t: 12.9, v: [1176, 464] }, { t: 13.05, v: [1176, 464], ease: "inOutCubic" }, { t: 13.75, v: [1703, 464] },
    { t: 14.0, v: [1703, 464], ease: "inOutCubic" }, { t: 14.4, v: [1790, 660] },
  ]);
  const cursor = $("cursor");
  cursor.setAttribute("transform", `translate(${cpos[0]} ${cpos[1]})`);
  cursor.style.opacity = String(at(t, 11.2, 0.2) * (1 - at(t, 13.95, 0.3)));
  for (const [x, y, ct, id] of CLICKS) {
    const c = $(id), p = at(t, ct, 0.5, ease.outCubic);
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 8 + 34 * p);
    c.setAttribute("opacity", String(t < ct ? 0 : (1 - p) * 0.9));
  }

  // ---- record, spark, pane ----
  const rIn = at(t, 14.6, 0.75, ease.outQuint);
  const collapse = at(t, 17.4, 0.62, ease.inOutCubic);
  clipRect(rec, rIn, { from: "top" });
  rec.style.transformOrigin = "363px 513px";
  rec.style.transform = `translateY(${(1 - rIn) * -24}px) scale(${1 - collapse * 0.98})`;
  rec.style.opacity = String(1 - at(t, 17.6, 0.24));
  setVis(rec, t > 14.55 && t < 18.1);
  const recRise = (n, t0) => at(t, t0, 0.5, ease.outCubic);
  ["rk1", "rv1", "rk2", "rv2", "rk3", "rk4", "rv4", "rec-title"].forEach((id, k) => {
    const p = recRise(k, 14.9 + Math.min(k, 6) * 0.1);
    $(id).style.opacity = String(p); $(id).style.transform = `translateY(${(1 - p) * 10}px)`;
  });
  const sp = at(t, 16.15, 0.6, ease.inOutCubic);
  const sy = lerp(592, 700, sp);
  const sl = $("spark-line"); drawPath(sl, sp); sl.style.opacity = String(sp <= 0 ? 0 : 0.7 * (1 - at(t, 16.75, 0.3)));
  const sparkOut = at(t, 17.6, 0.25);
  const sparkOn = t >= 16.1 && t < 18.0;
  $("spark").setAttribute("cx", 1440); $("spark").setAttribute("cy", sy);
  $("spark-halo").setAttribute("cx", 1440); $("spark-halo").setAttribute("cy", sy);
  $("spark").style.opacity = String(sparkOn ? 1 - sparkOut : 0); $("spark-halo").style.opacity = String(sparkOn ? 0.9 * (1 - sparkOut) : 0);
  const paneIn = at(t, 16.62, 0.5, ease.outQuint);

  pane.style.transformOrigin = "363px 3px";
  pane.style.transform = `scale(${1 - collapse * 0.98})`;
  pane.style.opacity = String(1 - at(t, 17.6, 0.24));
  setVis(pane, t > 16.6 && t < 18.1);
  const nPane = Math.floor(clamp((t - 16.95) / 0.5) * DEMO.pane.length + 1e-6);
  panetext.innerHTML = `<span class="o">&gt; </span>${DEMO.pane.slice(0, nPane)}`;
  panecaret.style.left = 32 + (2 + nPane) * (34 * 0.6) + 2 + "px";
  panecaret.style.opacity = String(t < 17.0 ? 1 : Math.floor(t * 2) % 2 === 0 ? 1 : 0.15);

  // ---- close: the spark becomes the flame ----

  const fs = Math.max(0.001, t < 17.9 ? 0 : fp);
  const flick = t < 18.9 ? 0 : 1;
  const wob = 1 + flick * (0.018 * Math.sin(t * 11.3) + 0.012 * Math.sin(t * 17.9 + 1.3));
  const skew = flick * 1.6 * Math.sin(t * 7.1 + 0.4);

  flame.style.transform = `translate(0px, 0px) scale(${fs * (0.98 + 0.02 * wob)}, ${fs * wob}) skewX(${skew}deg)`;
  setVis(flame, t >= 17.85);
  const fgA = at(t, 17.95, 0.9, ease.outCubic) * (0.85 + 0.15 * Math.sin(t * 9.3));
  flameglow.style.background = `radial-gradient(ellipse 50% 50% at 50% 55%, rgba(255,99,55,${(0.55 * fgA).toFixed(3)}), rgba(255,99,55,0) 70%)`;
  setVis(flameglow, t >= 17.85);
  const ember = at(t, 17.62, 0.22, ease.outCubic) * (1 - at(t, 17.95, 0.2));

  const tagIn = at(t, tagT, 0.7, ease.outQuint);

  $("track-head").setAttribute("opacity", String(t > 0.2 ? 1 : 0)); $("track-fill").setAttribute("opacity", t > 0.2 ? 1 : 0);
}

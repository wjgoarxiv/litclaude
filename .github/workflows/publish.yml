# Publishes @litfamily/litclaude from GitHub with npm trusted publishing, so every version carries a
# provenance statement that links the tarball to this repository and commit. Run it by hand from main.
# The suite does not run again here: the publish gate refuses unless ci.yml passed on this exact commit.
# The default is a dry run that only runs the gates and lists the tarball. A real run uploads a staged
# version; it stays private until the maintainer approves it on npmjs.com with two-factor authentication.
name: Publish

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Upload a staged version to npm (off = gates and pack listing only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      LITCLAUDE_AUTO_INSTALL: "0"
      LITCLAUDE_PUBLISH_FROM_CI: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm with staged publishing
        run: npm install -g npm@11.21.1

      - name: Validate plugin
        run: npm run validate:plugin

      - name: Doctor
        run: npm run doctor

      - name: Skill-resource manifest drift check
        run: npm run check:skill-resources

      - name: Canonical runtime-closure drift check
        run: npm run check:runtime-closures

      - name: Version lockstep check
        run: npm run check:version

      - name: Assert CI workflow integrity
        run: npm run assert:ci

      - name: Legacy-token scan
        run: npm run scan:legacy-tokens

      - name: Pack payload guard
        run: npm run pack:payload-guard

      # prepublishOnly (scripts/prepublish-test-gate.mjs) checks the GitHub API for a green ci.yml push run
      # on this commit; on a dry run the same check runs as its own step.
      - name: ci.yml passed on this commit
        if: ${{ !inputs.stage }}
        run: node scripts/prepublish-test-gate.mjs

      - name: Pack listing
        if: ${{ !inputs.stage }}
        run: npm pack --dry-run

      - name: Stage on npm (the gate checks ci.yml first)
        if: inputs.stage
        run: npm stage publish
